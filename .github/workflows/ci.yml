name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Lint
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ./IdentityGuard -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { throw "$($issues.Count) PSScriptAnalyzer error(s)." }

      - name: Test
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  windows-powershell:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  demo-report:
    name: Demo report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate demo report
        shell: pwsh
        run: |
          Import-Module ./IdentityGuard/IdentityGuard.psd1 -Force
          New-Item -ItemType Directory -Force -Path ./docs | Out-Null
          Invoke-IdentityGuard -Scope All -DemoMode -OutputPath ./docs/demo-report.html
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: docs/demo-report.html
